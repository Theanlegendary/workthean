<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170">
  <rect width="300" height="170" fill="#1D2226" rx="4"/>
  <!-- Technical architectural graphic -->
  <g opacity="0.2" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="300" y2="40"/>
    <line x1="0" y1="85" x2="300" y2="85"/>
    <line x1="0" y1="130" x2="300" y2="130"/>
    <line x1="75" y1="0" x2="75" y2="170"/>
    <line x1="150" y1="0" x2="150" y2="170"/>
    <line x1="225" y1="0" x2="225" y2="170"/>
  </g>
  <!-- Geometric Editorial Backdrop -->
  <rect x="15" y="15" width="270" height="140" fill="#1D2226" opacity="0.6" rx="3"/>
  <!-- Visual Focus Graphic -->
  <circle cx="150" cy="80" r="38" fill="#FFFFFF" opacity="0.15"/>
  <polygon points="140,65 170,80 140,95" fill="#FFFFFF" opacity="0.8"/>
  <!-- Category Pill -->
  <rect x="25" y="25" width="130" height="20" fill="#0A66C2" rx="2"/>
  <text x="90" y="39" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">VOCATIONAL TALENT</text>
  <text x="25" y="140" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">National Skilled Craftsmanship Showcase</text>
</svg>