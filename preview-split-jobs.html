    }

      font-weight: 800;
      color: #0F172A;

    .split-jobs-sub {

      font-size: 14px;
      color: #64748B;
      font-weight: 400;
    }

      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .job-chip-btn {
      border: none;
      background: #FFFFFF;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .job-chip-btn:hover {
      border-color: #0A66C2;
      color: #0A66C2;
      background: #EFF6FF;
    }
    .job-chip-btn.active {
      background: #0A66C2;
      color: #FFFFFF;
      border-color: #0A66C2;

      font-weight: 700;
      color: #0A66C2;
      background: #EFF6FF;
      padding: 5px 12px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .split-job-layout {
      display: grid;
      grid-template-columns: 440px 1fr;
      background: #FFFFFF;
      border: none !important;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      min-height: 680px;
      max-height: 740px;
      overflow: hidden;
    }

    .job-list-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #F1F5F9;
      height: 100%;
      max-height: 740px;
      overflow-y: auto;
      background: #FAFAFB;
      padding: 10px;
    }
    .job-list-panel::-webkit-scrollbar,
    .job-detail-panel::-webkit-scrollbar {
      width: 5px;
    }
    .job-list-panel::-webkit-scrollbar-thumb,
    .job-detail-panel::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 4px;
    }

      padding: 8px 12px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border-bottom: 1px solid #F1F5F9;
      margin-bottom: 8px;

      font-weight: 700;
      color: #191919;
      display: block;
    }
    .linkedin-list-sub {
      font-size: 11.5px;
      color: #64748B;
      display: block;
      margin-top: 1px;
    }
    .linkedin-list-count {
      font-size: 12px;
      font-weight: 700;
      color: #0A66C2;

      border-bottom: 1px solid #F1F5F9 !important;
      border-radius: 8px !important;
      background: #FFFFFF;
      box-shadow: none !important;
      padding: 14px 16px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;

    }

    let currentFilter = 'all';
    let selectedJobId = enterpriseJobsDatabase[0] ? enterpriseJobsDatabase[0].id : null;

    function getFilteredJobs() {
      if (currentFilter === 'all') return enterpriseJobsDatabase;
      if (currentFilter === 'urgent') return enterpriseJobsDatabase.filter(j => j.isUrgent);
      return enterpriseJobsDatabase.filter(j => j.category === currentFilter);
    }

    function renderJobList() {
      const container = document.getElementById('jobs-list-container');
      const counterBadge = document.getElementById('job-filter-count');
      const listCounter = document.getElementById('linkedin-jobs-counter');
      const filtered = getFilteredJobs();

      if (counterBadge) counterBadge.textContent = `${filtered.length} Openings Available`;
      if (listCounter) listCounter.textContent = `${filtered.length} openings`;

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:40px 20px; text-align:center; color:#64748B;">No openings found in this category.</div>`;
        return;
      }

      if (!filtered.some(j => j.id === selectedJobId)) {
        selectedJobId = filtered[0].id;
      }

      container.innerHTML = filtered.map(job => {
        const isSelected = job.id === selectedJobId;
        return `
          <article class="job-feed-card ${isSelected ? 'active' : ''}" onclick="selectJob('${job.id}')">
            <div style="display:flex; gap:12px; align-items:flex-start;">
              <div style="width:42px; height:42px; flex-shrink:0;">
                <img src="${job.companyLogo}" alt="${job.company}" style="width:100%; height:100%; object-fit:contain;">
              </div>
              <div style="flex:1; min-width:0;">
                <h3 class="job-card-title">${job.title}</h3>
                <div class="job-card-company">${job.company}</div>
                <div class="job-card-location"><i class="fa-solid fa-location-dot" style="font-size:11px; margin-right:4px;"></i> ${job.location}</div>
                <div class="job-card-salary">${job.salary}</div>
                <div class="job-card-meta">
                  <span>${job.time}</span>
                  <span>•</span>
                  <span>${job.applicants}</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      renderJobDetail(selectedJobId);
    }

    function selectJob(jobId) {
      selectedJobId = jobId;
      document.querySelectorAll('.job-feed-card').forEach(el => {
        el.classList.remove('active');
      });
      const targetCard = document.querySelector(`.job-feed-card[onclick*="${jobId}"]`);
      if (targetCard) targetCard.classList.add('active');
      renderJobDetail(jobId);
    }

    function renderJobDetail(jobId) {
      const panel = document.getElementById('job-detail-panel');
      const job = enterpriseJobsDatabase.find(j => j.id === jobId) || enterpriseJobsDatabase[0];
      if (!job) return;

      panel.innerHTML = `
        <div style="padding-bottom: 20px; border-bottom: none; margin-bottom: 22px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
            <div>
              <h1 style="font-size: 21px; font-weight: 800; color: #0F172A; margin: 0 0 6px 0; line-height: 1.3;">${job.title}</h1>
              <div style="display:flex; align-items:center; gap:8px; font-size:13.5px; color:#475569; flex-wrap:wrap; margin-bottom:8px;">
                <span style="font-weight:700; color:#0A66C2;">${job.company}</span>
                <span>•</span>
                <span><i class="fa-solid fa-location-dot"></i> ${job.location}</span>
                <span>•</span>
                <span style="color:#059669; font-weight:600;"><i class="fa-solid fa-clock"></i> ${job.time}</span>
              </div>
              <div style="font-size:17px; font-weight:800; color:#0F172A;">
                ${job.salary}
              </div>
            </div>
            <div style="width:58px; height:58px; flex-shrink:0;">
              <img src="${job.companyLogo}" alt="${job.company}" style="width:100%; height:100%; object-fit:contain;">
            </div>
          </div>

          <div style="display:flex; gap:12px; margin-top:18px;">
            <button type="button" onclick="alert('Application submitted directly to ${job.company} for position: ${job.title}');" style="background:#0A66C2; color:#fff; border:none; padding:10px 24px; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; box-shadow:0 2px 8px rgba(10,102,194,0.3);">
              <i class="fa-solid fa-paper-plane"></i> Apply Now
            </button>
            <button type="button" onclick="this.innerHTML = '<i class=\'fa-solid fa-bookmark\'></i> Saved'; this.style.borderColor='#0A66C2'; this.style.color='#0A66C2';" style="background:#fff; border:1px solid #CBD5E1; color:#475569; padding:10px 18px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
              <i class="fa-regular fa-bookmark"></i> Save Job
            </button>
          </div>
        </div>

        <div style="margin-bottom: 22px;">
          <h3 style="font-size: 15px; font-weight: 700; color: #0F172A; margin: 0 0 8px 0; text-transform:uppercase; letter-spacing:0.3px;">About the job</h3>
          <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 0;">${job.overview || 'Accredited high-impact logistics opening with competitive compensation and clear executive advancement.'}</p>
        </div>

        <div style="margin-bottom: 22px;">
          <h3 style="font-size: 15px; font-weight: 700; color: #0F172A; margin: 0 0 8px 0; text-transform:uppercase; letter-spacing:0.3px;">Key Responsibilities</h3>
          <ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #475569; line-height: 1.6;">
            ${(job.responsibilities || [
              'Coordinate cross-border cargo routing, carrier negotiations, and priority allocations.',
              'Ensure full customs compliance, tariff audits, and FMC bill-of-lading accuracy.',
              'Drive operational KPIs across regional distribution centers and terminal hubs.'
            ]).map(r => `<li style="margin-bottom: 6px;">${r}</li>`).join('')}
          </ul>
        </div>

        <div style="margin-bottom: 22px;">
          <h3 style="font-size: 15px; font-weight: 700; color: #0F172A; margin: 0 0 8px 0; text-transform:uppercase; letter-spacing:0.3px;">Candidate Qualifications &amp; Requirements</h3>
          <ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #475569; line-height: 1.6;">
            ${(job.requirements || [
              'Minimum 3+ years proven industry experience in freight forwarding, 3PL or terminal management.',
              'Proficiency in bilingual communication and international maritime customs procedures.',
              'Demonstrated leadership in supply chain network optimization.'
            ]).map(rq => `<li style="margin-bottom: 6px;">${rq}</li>`).join('')}
          </ul>
        </div>

        <div style="padding-top: 18px; border-top: none;">
          <h3 style="font-size: 15px; font-weight: 700; color: #0F172A; margin: 0 0 10px 0; text-transform:uppercase; letter-spacing:0.3px;">About the company</h3>
          <div style="display:flex; justify-content:space-between; align-items:center; background:#F8FAFC; padding:14px 18px; border-radius:10px; border:1px solid #E2E8F0;">
            <div style="display:flex; align-items:center; gap:12px;">
              <div style="width:42px; height:42px; flex-shrink:0;">
                <img src="${job.companyLogo}" alt="${job.company}" style="width:100%; height:100%; object-fit:contain;">
              </div>
              <div>
                <div style="font-weight:700; font-size:14px; color:#0F172A;">${job.company}</div>
                <div style="font-size:12px; color:#64748B;">Accredited Enterprise Hiring Partner</div>
              </div>
            </div>
            <button type="button" onclick="this.textContent = 'Following'; this.style.background='#0F172A'; this.style.color='#fff';" style="background:#fff; border:1px solid #CBD5E1; color:#0F172A; padding:6px 16px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer;">
              + Follow
            </button>
          </div>
        </div>
      `;
    }

    // Filter Chips Event Listeners
    document.querySelectorAll('.job-chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.job-chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderJobList();
      });
    });

    // Initialize
    renderJobList();
  </script>
