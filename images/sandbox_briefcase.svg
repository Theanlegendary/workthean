<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60" fill="none">
  <!-- Soft drop shadow -->
  <ellipse cx="45" cy="54" rx="26" ry="4" fill="#1E3A8A" opacity="0.18" />

  <!-- Briefcase Main Body (Isometric 3D perspective) -->
  <g id="briefcase">
    <!-- Top Handle -->
    <path d="M37 18 C37 14, 47 14, 47 18" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M36 19 H48" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" />

    <!-- Main Briefcase Body -->
    <rect x="25" y="21" width="36" height="28" rx="6" fill="url(#caseGradient)" />
    <!-- Flap top curve -->
    <path d="M25 25 C25 22 28 21 31 21 H55 C58 21 61 22 61 25 V33 C53 36 33 36 25 33 Z" fill="url(#flapGradient)" />
    <!-- Center Buckle / Clasp -->
    <rect x="40.5" y="30" width="5" height="7" rx="1.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.75" />
    <circle cx="43" cy="33.5" r="1" fill="#475569" />
    <!-- Accent Stitching Lines -->
    <path d="M27 24 V45" stroke="#3B82F6" stroke-width="0.75" stroke-dasharray="2,1" opacity="0.6" />
    <path d="M59 24 V45" stroke="#3B82F6" stroke-width="0.75" stroke-dasharray="2,1" opacity="0.6" />
  </g>

  <!-- Paper Airplane Floating Top Right -->
  <g id="paper-airplane" transform="translate(48, 4) rotate(12)">
    <!-- Speed motion dashes -->
    <path d="M-6 16 C-2 15, 2 13, 6 10" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5,2.5" opacity="0.8" />
    <!-- Airplane Body -->
    <path d="M22 2 L6 14 L12 16 L22 2 Z" fill="#60A5FA" />
    <path d="M22 2 L12 16 L14 20 L22 2 Z" fill="#3B82F6" />
    <path d="M22 2 L6 14 L11 11 L22 2 Z" fill="#93C5FD" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="caseGradient" x1="25" y1="21" x2="61" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="flapGradient" x1="25" y1="21" x2="61" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
</svg>
