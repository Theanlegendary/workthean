<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 260" width="450" height="260">
  <rect width="450" height="260" fill="#12161A" rx="4"/>
  
  <!-- Studio Screen Simulation -->
  <g opacity="0.2" stroke="#0A66C2" stroke-width="1">
    <line x1="0" y1="65" x2="450" y2="65"/>
    <line x1="0" y1="130" x2="450" y2="130"/>
    <line x1="0" y1="195" x2="450" y2="195"/>
    <line x1="112" y1="0" x2="112" y2="260"/>
    <line x1="225" y1="0" x2="225" y2="260"/>
    <line x1="338" y1="0" x2="338" y2="260"/>
  </g>

  <!-- Live Studio Broadcast Graphic Overlay -->
  <g transform="translate(45, 40)">
    <rect width="360" height="125" fill="#1D2226" rx="4" stroke="#333F48" stroke-width="1"/>
    <!-- Mock Stock/Labor Ticker Line Chart -->
    <polyline points="20,95 70,80 120,85 160,55 210,65 260,35 330,40" fill="none" stroke="#0A66C2" stroke-width="3"/>
    <circle cx="330" cy="40" r="5" fill="#057642"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">CETTIC NATIONAL LABOR INTELLIGENCE</text>
    <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#A0AAB5">Real-Time Policy &amp; Enterprise Vocational Data Stream</text>
  </g>

  <!-- Live Player Controls Bar at Bottom -->
  <rect x="0" y="220" width="450" height="40" fill="#000000" opacity="0.85"/>
  
  <!-- Play/Pause -->
  <g transform="translate(18, 232)" fill="#FFFFFF">
    <rect x="0" y="0" width="4" height="16" rx="1"/>
    <rect x="8" y="0" width="4" height="16" rx="1"/>
  </g>

  <!-- Volume -->
  <g transform="translate(42, 232)" stroke="#FFFFFF" stroke-width="1.8" fill="none">
    <polygon points="0,5 5,5 10,1 10,15 5,11 0,11" fill="#FFFFFF" stroke="none"/>
    <path d="M 13 4 Q 17 8 13 12"/>
  </g>

  <!-- Red LIVE Badge -->
  <circle cx="88" cy="240" r="4.5" fill="#CC1016"/>
  <text x="98" y="244" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1">LIVE</text>

  <!-- 1080p Badge -->
  <text x="380" y="244" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">1080p</text>

  <!-- Fullscreen Icon -->
  <g transform="translate(420, 233)" stroke="#FFFFFF" stroke-width="1.8" fill="none">
    <polyline points="0,4 0,0 4,0"/>
    <polyline points="10,0 14,0 14,4"/>
    <polyline points="14,10 14,14 10,14"/>
    <polyline points="4,14 0,14 0,10"/>
  </g>
</svg>