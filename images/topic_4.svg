<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <defs>
    <linearGradient id="t4-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5EBE1"/>
    </linearGradient>
    <linearGradient id="t4-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#A47E53"/>
    </linearGradient>
  </defs>
  <rect width="240" height="140" fill="url(#t4-bg)" rx="7"/>
  <!-- Open Book & Pages (NO TEXT) -->
  <rect x="0" y="105" width="240" height="35" fill="url(#t4-wood)" opacity="0.3"/>
  <g transform="translate(140, 55)">
    <!-- Book Spine & Pages -->
    <path d="M0,35 C20,15 50,15 70,30 L70,45 C50,30 20,30 0,50 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>
    <path d="M0,35 C-20,15 -50,15 -70,30 L-70,45 C-50,30 -20,30 0,50 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>
    <!-- Page layers -->
    <path d="M0,32 C18,12 48,12 68,27" stroke="#E5E7EB" stroke-width="1.2" fill="none"/>
    <path d="M0,30 C16,10 46,10 66,24" stroke="#E5E7EB" stroke-width="1.2" fill="none"/>
    <path d="M0,28 C14,8 44,8 64,21" stroke="#E5E7EB" stroke-width="1.2" fill="none"/>
  </g>
  <!-- Minimalist frame outline -->
  <rect x="25" y="20" width="80" height="36" fill="none" stroke="#C5A880" stroke-width="1.2" opacity="0.6"/>
</svg>
